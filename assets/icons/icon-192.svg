<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342824"/>
      <stop offset="100%" stop-color="#191311"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EDE4"/>
      <stop offset="40%" stop-color="#DFBA8E"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A58D7D" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#C5A059" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <g filter="url(#goldGlow)">
    <text x="256" y="270" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="160" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">PF</text>
  </g>
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#F5EDE4" text-anchor="middle" letter-spacing="12">PRAISE</text>
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#D2BBA5" text-anchor="middle" letter-spacing="6">ATELIER FURNITURE</text>
</svg>
